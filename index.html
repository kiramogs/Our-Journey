<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Our Love Map — A romantic scroll-driven journey through our most cherished memories together.">
    <title>Our Love Map ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-content">
            <h1 class="loader-title">Our Love Map</h1>
            <p class="loader-subtitle">Preparing our journey…</p>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-percent" id="loaderPercent">0%</p>
        </div>
    </div>

    <!-- Scroll Hint -->
    <div class="scroll-hint" id="scrollHint">
        <div class="scroll-hint-inner">
            <div class="scroll-mouse">
                <div class="scroll-wheel"></div>
            </div>
            <p>Scroll to explore</p>
        </div>
    </div>

    <!-- Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Scroll Spacer -->
    <div id="scrollSpacer"></div>

    <script src="script.js"></script>
</body>
</html>
